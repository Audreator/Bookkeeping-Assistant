      <stop offset=".46" stop-color="#303034" />
      <stop offset="1" stop-color="#202023" />
    </linearGradient>
    <linearGradient id="ledgerSheen" x1="200" y1="112" x2="276" y2="319" gradientUnits="userSpaceOnUse">
